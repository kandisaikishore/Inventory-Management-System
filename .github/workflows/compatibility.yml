name: JavaFX compatibility checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: read

jobs:
  maven-javafx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
          cache-dependency-path: inventory-management-system/pom.xml
      - name: Verify Maven project
        run: test -s inventory-management-system/pom.xml
      - name: Compile and test with declared JavaFX dependencies
        run: mvn --batch-mode --no-transfer-progress -f inventory-management-system/pom.xml test
